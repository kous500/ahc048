[general]
version = "0.1.1"

[problem]
problem_name = "AHC048"
objective = "Min"
score_regex = '(?m)^\s*Score\s*=\s*(?P<score>\d+)\s*$'

[test]
start_seed = 0
end_seed = 2000
threads = 0
out_dir = "./pahcer"

[[test.compile_steps]]
program = "g++"
args = [
    "-std=gnu++2b",
    "-O2",
    "-Wall",
    "-Wextra",
    "-mtune=native",
    "-march=native",
    "-fconstexpr-depth=2147483647",
    "-fconstexpr-loop-limit=2147483647",
    "-fconstexpr-ops-limit=2147483647",
    "-I${workspaceFolder}/ac-library/",
    "-I/opt/boost/gcc/include",
    "-L/opt/boost/gcc/lib",
    "-lgmpxx",
    "-lgmp",
    "-I/usr/include/eigen3",
    "main.cpp",
]

[[test.test_steps]]
program = "./a.out"
args = []
stdin = "./tools/in/{SEED04}.txt"
stdout = "./tools/out/{SEED04}.txt"
stderr = "./tools/err/{SEED04}.txt"
measure_time = true

[[test.test_steps]]
program = "cargo"
args = [
    "run",
    "--bin",
    "vis",
    "--release",
    "./in/{SEED04}.txt",
    "./out/{SEED04}.txt",
]
current_dir = "./tools"
measure_time = false

